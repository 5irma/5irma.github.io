<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goat Herd Monitoring Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-gray-100">
  <header class="bg-green-600 p-4 text-white text-center text-2xl font-bold">
    Goat Herd Monitoring Dashboard
  </header>
  
  <div class="p-4">
    <div class="mb-4">
      <input 
        type="text" 
        id="searchBar" 
        placeholder="Search goats by RFID, breed, or farm..." 
        class="w-full p-2 border rounded shadow-sm" 
        onkeyup="filterTable()"
      />
    </div>

    <table id="goatTable" class="w-full table-auto bg-white shadow-md rounded">
      <thead class="bg-green-700 text-white">
        <tr>
          <th class="p-2">RFID</th>
          <th class="p-2">Date of Birth</th>
          <th class="p-2">Gender</th>
          <th class="p-2">Parent RFID</th>
          <th class="p-2">Weight (kg)</th>
          <th class="p-2">Breed</th>
          <th class="p-2">Farm Name</th>
          <th class="p-2">Disease Status</th>
          <th class="p-2">Vaccination</th>
        </tr>
      </thead>
      <tbody id="goatTableBody"></tbody>
    </table>
  </div>

  <script>
    const supabaseUrl = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwd2xjbnBkamJlb3NicHBmcGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkzNjkyMjIsImV4cCI6MjA1NDk0NTIyMn0.SoPJ1ZlXu83CqrpLlwU7ak5UYlWTYaLhE8zIX2lSJYM"; // Replace with your Supabase URL
    const supabaseKey = "https://qpwlcnpdjbeosbppfpke.supabase.co"; // Replace with your Supabase anon key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchGoatData() {
      try {
        const { data, error } = await supabase
          .from('GOATS') // Replace with your actual Supabase table name
          .select('*');

        if (error) {
          console.error('Error fetching data:', error);
          return;
        }

        populateTable(data);
      } catch (error) {
        console.error('Unexpected error:', error);
      }
    }

    function populateTable(goatData) {
      const tableBody = document.getElementById('goatTableBody');
      tableBody.innerHTML = '';

      goatData.forEach(goat => {
        const row = document.createElement('tr');
        row.className = "border-b hover:bg-gray-100";

        row.innerHTML = `
          <td class="p-2">${goat.RFID}</td>
          <td class="p-2">${goat["Date of Birth"]}</td>
          <td class="p-2">${goat.Gender}</td>
          <td class="p-2">${goat["Parent RFID"] || "N/A"}</td>
          <td class="p-2">${goat["Weight (kg)"]}</td>
          <td class="p-2">${goat.Breed}</td>
          <td class="p-2">${goat["Farm Name"]}</td>
          <td class="p-2">${goat["Disease Status"]}</td>
          <td class="p-2">${goat.Vaccination}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    function filterTable() {
      const searchTerm = document.getElementById('searchBar').value.toLowerCase();
      const rows = document.querySelectorAll('#goatTableBody tr');

      rows.forEach(row => {
        const cells = Array.from(row.getElementsByTagName('td'));
        const match = cells.some(cell => cell.textContent.toLowerCase().includes(searchTerm));
        row.style.display = match ? '' : 'none';
      });
    }

    // Fetch data when the page loads
    fetchGoatData();
  </script>
</body>
</html>
