<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goat Herd Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Goat Herd Dashboard</h1>
  <table id="goatTable">
    <thead>
      <tr>
        <th>RFID</th>
        <th>Date of Birth</th>
        <th>Gender</th>
        <th>Parent RFID</th>
        <th>Offspring RFID</th>
        <th>Weight (kg)</th>
        <th>Breed</th>
        <th>Farm Name</th>
        <th>Disease Status</th>
        <th>Vaccination</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    async function fetchGoatData() {
      try {
        const response = await fetch("http://localhost:3000/api/goats");
        const data = await response.json();
        const tableBody = document.getElementById("goatTable").querySelector("tbody");

        data.forEach(goat => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${goat.RFID}</td>
            <td>${goat["Date of Birth"]}</td>
            <td>${goat.Gender}</td>
            <td>${goat["Parent RFID"]}</td>
            <td>${goat["Offspring RFID"]}</td>
            <td>${goat["Weight (kg)"]}</td>
            <td>${goat.Breed}</td>
            <td>${goat["Farm Name"]}</td>
            <td>${goat["Disease Status"]}</td>
            <td>${goat.Vaccination}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error("Failed to fetch goat data:", err);
      }
    }

    fetchGoatData();
  </script>
</body>
</html>
